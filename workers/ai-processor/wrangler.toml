name = "toneyarthi-ai-processor"
main = "src/index.ts"
compatibility_date = "2025-08-30"

[[queues.consumers]]
queue = "news-processing"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "news-processing-dlq"

[[queues.producers]]
binding = "TTS_QUEUE"
queue = "tts-processing"

[[d1_databases]]
binding = "DB"
database_name = "tone-yar-thi"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "tone-yar-thi-media"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://pub-account-specific-id.r2.dev"
