name = "toneyarthi-audio-processor"
main = "src/index.ts"
compatibility_date = "2025-08-30"

[[queues.consumers]]
queue = "tts-processing"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "tts-processing-dlq"

[[d1_databases]]
binding = "DB"
database_name = "tone-yar-thi"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "tone-yar-thi-media"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://pub-account-specific-id.r2.dev"
GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts"
TTS_NARRATOR = "Kore"
TTS_STYLE = "Clear, calm Burmese news narration"
TTS_TIMEOUT_MS = "60000"
ENVIRONMENT = "production"
RELEASE = "local"
