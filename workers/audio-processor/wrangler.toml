name = "toneyarthi-audio-processor-base"
main = "src/index.ts"
compatibility_date = "2025-08-30"
workers_dev = false
routes = []

# Bindings are intentionally defined only inside named environments. Never deploy
# this base configuration; use --env development, staging, or production.

[env.development]
name = "toneyarthi-audio-processor-dev"
workers_dev = false
routes = []

[[env.development.d1_databases]]
binding = "DB"
database_name = "toneyarthi-dev"
database_id = "10000000-0000-4000-8000-000000000001"
migrations_dir = "../../database/migrations"

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "toneyarthi-media-dev"

[[env.development.queues.consumers]]
queue = "toneyarthi-tts-processing-dev"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "toneyarthi-tts-processing-dlq-dev"

[env.development.vars]
ENVIRONMENT = "development"
RELEASE = "local"
MEDIA_PUBLIC_BASE_URL = "https://media-dev.toneyarthi.com"
GEMINI_TTS_MODEL = "gemini-2.5-flash-preview-tts"
TTS_NARRATOR = "Kore"
TTS_STYLE = "Clear, calm Burmese news narration"
TTS_TIMEOUT_MS = "60000"

[env.staging]
name = "toneyarthi-audio-processor-stg"
workers_dev = false
routes = []

[[env.staging.d1_databases]]
binding = "DB"
database_name = "toneyarthi-stg"
database_id = "20000000-0000-4000-8000-000000000002"
migrations_dir = "../../database/migrations"

[[env.staging.r2_buckets]]
