name = "toneyarthi-briefings"
main = "src/index.ts"
compatibility_date = "2025-08-30"

# Morning and evening in UTC. Deployments needing local wall-clock times should
# adjust these cron expressions; the event key still prevents duplicate runs.
[triggers]
crons = ["0 0 * * *", "0 12 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tone-yar-thi"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "../../database/migrations"

[vars]
BRIEFING_CONFIG = '{"minStories":5,"maxStories":8,"lookbackHours":36,"importanceWeight":0.45,"recencyWeight":0.35,"categoryDiversityWeight":0.20}'
