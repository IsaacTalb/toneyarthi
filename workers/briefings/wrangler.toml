name = "toneyarthi-briefings-base"
main = "src/index.ts"
compatibility_date = "2025-08-30"
workers_dev = false
routes = []

# Bindings are intentionally defined only inside named environments. Never deploy
# this base configuration; use --env development, staging, or production.

[env.development]
name = "toneyarthi-briefings-dev"
workers_dev = false
routes = []
triggers = { crons = ["0 0 * * *", "0 12 * * *"] }

[[env.development.d1_databases]]
binding = "DB"
database_name = "toneyarthi-dev"
database_id = "10000000-0000-4000-8000-000000000001"
migrations_dir = "../../database/migrations"

[env.development.vars]
ENVIRONMENT = "development"
RELEASE = "local"
BRIEFING_CONFIG = '{"minStories":5,"maxStories":8,"lookbackHours":36,"importanceWeight":0.45,"recencyWeight":0.35,"categoryDiversityWeight":0.20}'

[env.staging]
name = "toneyarthi-briefings-stg"
workers_dev = false
routes = []
triggers = { crons = ["0 0 * * *", "0 12 * * *"] }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "toneyarthi-stg"
database_id = "20000000-0000-4000-8000-000000000002"
migrations_dir = "../../database/migrations"

[env.staging.vars]
ENVIRONMENT = "staging"
RELEASE = "local"
BRIEFING_CONFIG = '{"minStories":5,"maxStories":8,"lookbackHours":36,"importanceWeight":0.45,"recencyWeight":0.35,"categoryDiversityWeight":0.20}'

[env.production]
name = "toneyarthi-briefings-prod"
workers_dev = false
routes = []
triggers = { crons = ["0 0 * * *", "0 12 * * *"] }

[[env.production.d1_databases]]
binding = "DB"
database_name = "toneyarthi-prod"
database_id = "30000000-0000-4000-8000-000000000003"
migrations_dir = "../../database/migrations"

[env.production.vars]
ENVIRONMENT = "production"
RELEASE = "local"
BRIEFING_CONFIG = '{"minStories":5,"maxStories":8,"lookbackHours":36,"importanceWeight":0.45,"recencyWeight":0.35,"categoryDiversityWeight":0.20}'
