name = "toneyarthi-ingest-base"
main = "src/index.ts"
compatibility_date = "2025-08-30"
workers_dev = false
routes = []

# Bindings are intentionally defined only inside named environments. Never deploy
# this base configuration; use --env development, staging, or production.

[env.development]
name = "toneyarthi-ingest-dev"
workers_dev = false
routes = []
triggers = { crons = ["0 */6 * * *"] }

[[env.development.d1_databases]]
binding = "DB"
database_name = "toneyarthi-dev"
database_id = "10000000-0000-4000-8000-000000000001"
migrations_dir = "../../database/migrations"

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "toneyarthi-media-dev"

[[env.development.queues.producers]]
binding = "NEWS_QUEUE"
queue = "toneyarthi-news-processing-dev"

[env.development.vars]
ENVIRONMENT = "development"
RELEASE = "local"
MEDIA_PUBLIC_BASE_URL = "https://media-dev.toneyarthi.com"

[env.staging]
name = "toneyarthi-ingest-stg"
workers_dev = false
routes = []
triggers = { crons = ["0 */6 * * *"] }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "toneyarthi-stg"
database_id = "20000000-0000-4000-8000-000000000002"
migrations_dir = "../../database/migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "toneyarthi-media-stg"

[[env.staging.queues.producers]]
binding = "NEWS_QUEUE"
queue = "toneyarthi-news-processing-stg"

[env.staging.vars]
ENVIRONMENT = "staging"
RELEASE = "local"
MEDIA_PUBLIC_BASE_URL = "https://media-stg.toneyarthi.com"

[env.production]
name = "toneyarthi-ingest-prod"
workers_dev = false
routes = []
triggers = { crons = ["0 */6 * * *"] }

[[env.production.d1_databases]]
binding = "DB"
database_name = "toneyarthi-prod"
database_id = "30000000-0000-4000-8000-000000000003"
migrations_dir = "../../database/migrations"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "toneyarthi-media-prod"

[[env.production.queues.producers]]
binding = "NEWS_QUEUE"
queue = "toneyarthi-news-processing-prod"

[env.production.vars]
ENVIRONMENT = "production"
RELEASE = "local"
MEDIA_PUBLIC_BASE_URL = "https://media-prod.toneyarthi.com"
