name = "toneyarthi-ingest"
main = "src/index.ts"
compatibility_date = "2025-08-30"

[triggers]
crons = ["0 */6 * * *"]

[[queues.producers]]
binding = "NEWS_QUEUE"
queue = "news-processing"

[[d1_databases]]
binding = "DB"
database_name = "tone-yar-thi"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "tone-yar-thi-media"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://pub-account-specific-id.r2.dev"
ENVIRONMENT = "production"

[env.development.vars]
ENVIRONMENT = "development"
# Configure INGEST_TRIGGER_SECRET with `wrangler secret put`; it is
# intentionally absent from vars and source control.
