name = "toneyarthi-api"
main = "src/index.ts"
compatibility_date = "2025-08-30"

[[d1_databases]]
binding = "DB"
database_name = "tone-yar-thi"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "tone-yar-thi-media"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://pub-account-specific-id.r2.dev"
# Comma-separated, exact browser origins. An empty value denies cross-origin access.
ALLOWED_ORIGINS = ""
# Set as a Worker secret (`wrangler secret put ADMIN_API_TOKEN`), never here.
# Automatic publishing remains disabled; admin publication always requires an
# authenticated request with explicit approval.
