name = "toneyarthi-api-base"
main = "src/index.ts"
compatibility_date = "2025-08-30"
workers_dev = false
routes = []

# Bindings are intentionally defined only inside named environments. Never deploy
# this base configuration; use --env development, staging, or production.

[env.development]
name = "toneyarthi-api-dev"
workers_dev = false
routes = [{ pattern = "api-dev.toneyarthi.com", custom_domain = true }]

[[env.development.d1_databases]]
binding = "DB"
database_name = "toneyarthi-dev"
database_id = "10000000-0000-4000-8000-000000000001"
migrations_dir = "../../database/migrations"

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "toneyarthi-media-dev"

[[env.development.queues.producers]]
binding = "PIPELINE_QUEUE"
queue = "toneyarthi-news-processing-dev"

[[env.development.queues.producers]]
binding = "TTS_QUEUE"
queue = "toneyarthi-tts-processing-dev"

[env.development.vars]
ENVIRONMENT = "development"
RELEASE = "local"
MEDIA_PUBLIC_BASE_URL = "https://media-dev.toneyarthi.com"
ALLOWED_ORIGINS = "https://admin-dev.toneyarthi.com"

[[env.development.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1101"
simple = { limit = 60, period = 60 }

[env.staging]
name = "toneyarthi-api-stg"
workers_dev = false
routes = [{ pattern = "api-staging.toneyarthi.com", custom_domain = true }]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "toneyarthi-stg"
database_id = "20000000-0000-4000-8000-000000000002"
migrations_dir = "../../database/migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "toneyarthi-media-stg"

[[env.staging.queues.producers]]
binding = "PIPELINE_QUEUE"
queue = "toneyarthi-news-processing-stg"

[[env.staging.queues.producers]]
binding = "TTS_QUEUE"
queue = "toneyarthi-tts-processing-stg"

[env.staging.vars]
ENVIRONMENT = "staging"
RELEASE = "local"
MEDIA_PUBLIC_BASE_URL = "https://media-stg.toneyarthi.com"
ALLOWED_ORIGINS = "https://admin-stg.toneyarthi.com"

[[env.staging.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1201"
simple = { limit = 60, period = 60 }

[env.production]
name = "toneyarthi-api-prod"
workers_dev = false
routes = [{ pattern = "api.toneyarthi.com", custom_domain = true }]

[[env.production.d1_databases]]
binding = "DB"
database_name = "toneyarthi-prod"
database_id = "30000000-0000-4000-8000-000000000003"
migrations_dir = "../../database/migrations"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "toneyarthi-media-prod"

[[env.production.queues.producers]]
binding = "PIPELINE_QUEUE"
queue = "toneyarthi-news-processing-prod"

[[env.production.queues.producers]]
binding = "TTS_QUEUE"
queue = "toneyarthi-tts-processing-prod"

[env.production.vars]
ENVIRONMENT = "production"
RELEASE = "local"
MEDIA_PUBLIC_BASE_URL = "https://media-prod.toneyarthi.com"
ALLOWED_ORIGINS = "https://admin-prod.toneyarthi.com"

[[env.production.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1301"
simple = { limit = 60, period = 60 }
